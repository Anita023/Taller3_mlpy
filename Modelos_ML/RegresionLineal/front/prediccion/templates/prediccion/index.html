<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasador de Viviendas</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            background: #ffffff;
            color: #18181b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 96px 24px;
            margin: 0;
        }
        .card {
            max-width: 380px;
            width: 100%;
        }
        .icon-house {
            width: 40px;
            height: 40px;
            margin-bottom: 32px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 8px;
            color: #18181b;
            letter-spacing: -0.02em;
        }
        .subtitle {
            color: #a1a1aa;
            font-size: 0.9rem;
            margin: 0 0 40px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #71717a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .input-wrap {
            margin-bottom: 32px;
        }
        input[type="number"] {
            width: 100%;
            padding: 0 0 12px;
            border: none;
            border-bottom: 1px solid #e4e4e7;
            background: transparent;
            color: #18181b;
            font-size: 1.5rem;
            font-weight: 500;
            transition: border-color 0.15s ease;
        }
        input[type="number"]::placeholder {
            color: #d4d4d8;
            font-weight: 400;
        }
        input[type="number"]:focus {
            outline: none;
            border-bottom-color: #18181b;
        }
        button {
            width: 100%;
            padding: 14px 12px;
            border-radius: 6px;
            border: none;
            background: #18181b;
            color: #fafafa;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button:hover { background: #3f3f46; }
        .resultado {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #f4f4f5;
        }
        .resultado .etiqueta {
            font-size: 0.8rem;
            color: #a1a1aa;
            margin-bottom: 6px;
        }
        .resultado .precio {
            font-size: 2rem;
            font-weight: 600;
            color: #18181b;
            letter-spacing: -0.02em;
        }
        .error {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f4f4f5;
            color: #a1a1aa;
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <svg class="icon-house" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5 12 3l9 6.5"></path>
            <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path>
        </svg>

        <h1>Tasador de Viviendas</h1>
        <p class="subtitle">Estima el valor de una vivienda por su área.</p>

        <form method="post">
            {% csrf_token %}
            <label for="area_m2">Área en metros cuadrados</label>
            <div class="input-wrap">
                <input
                    type="number"
                    id="area_m2"
                    name="area_m2"
                    step="0.1"
                    min="0.1"
                    placeholder="85.5"
                    value="{{ area_ingresada|default:'' }}"
                    required
                >
            </div>
            <button type="submit">Calcular precio</button>
        </form>

        {% if resultado %}
        <div class="resultado">
            <div class="etiqueta">Valor estimado para {{ resultado.area_m2 }} m²</div>
            <div class="precio">${{ resultado.predicted_price }}</div>
        </div>
        {% endif %}

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
